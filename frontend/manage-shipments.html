<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Shipments - Smart Courier</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h2>Manage Shipments</h2>

        <input type="text" id="searchID" placeholder="Enter Tracking ID">
        <button onclick="searchShipment()">Search</button>

        <div id="shipmentDetails"></div>

        <hr>

        <h3>Update Shipment Status</h3>
        <input type="text" id="updateID" placeholder="Tracking ID">

        <select id="newStatus">
            <option value="Pending">Pending</option>
            <option value="In Transit">In Transit</option>
            <option value="Delivered">Delivered</option>
        </select>

        <button onclick="updateStatus()">Update Status</button>

        <p><a href="admin-dashboard.html">Back to Dashboard</a></p>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
